services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: disaster-cloudflared
    restart: unless-stopped
    command: tunnel --metrics 0.0.0.0:20241 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    # 컨테이너 프로세스는 떠 있어도 엣지와의 QUIC 연결만 끊겨 재시도를 반복하는 경우가 있다
    # (2026-10-18 실측 — UDP 연결이 끊긴 채 8일간 재시도만 하며 터널 불통). 컨테이너 자체는
    # 죽지 않으므로 `restart: unless-stopped`만으로는 복구가 안 되고, 터널 연결 상태를 직접
    # 확인하는 healthcheck + 아래 autoheal이 있어야 자동 재시작된다.
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "0.0.0.0:20241", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "autoheal=true"
    depends_on:
      - backend
      - frontend

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: disaster-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
      args:
        BASE_API_URL: http://backend:8080
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${NEXT_PUBLIC_FIREBASE_VAPID_KEY}
    container_name: disaster-frontend
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: disaster-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: prod


  dozzle:
    image: amir20/dozzle:latest
    container_name: disaster-dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  redis:
    image: redis:7-alpine
    container_name: disaster-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  postgres:
    image: pgvector/pgvector:pg16
    container_name: disaster-postgres
    restart: unless-stopped
    shm_size: '128mb'
    command: ["postgres", "-c", "max_parallel_workers_per_gather=0"]
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  postgres_data:
