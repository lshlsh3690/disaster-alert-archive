name: deploy
on:
  push:
    branches: [ "develop" ]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: [self-hosted]
    steps:
      # clean: false — actions/checkout 기본값(true)은 매 실행마다 git clean -ffdx를 돌려서
      # .gitignore에 등록된 파일(.env 포함)까지 지운다. self-hosted 러너 워크스페이스에
      # 한 번만 수동으로 채워둔 .env가 다음 배포 때 사라지면 안 되므로 꺼둔다.
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Firebase 서비스 계정 키 생성
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' \
          > backend/src/main/resources/firebase-service-account.json

      - name: 이미지 빌드 (backend, frontend)
        run: docker compose -f docker-compose.prod.yml build backend frontend

      - name: 재기동 (backend, frontend만 — postgres/redis/cloudflared는 유지)
        run: docker compose -f docker-compose.prod.yml up -d --force-recreate --no-deps backend frontend

      - name: 미사용 이미지 정리
        run: docker image prune -f || true
