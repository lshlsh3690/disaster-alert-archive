services:
  frontend:
    profiles:
      - docker
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: disaster-frontend
    ports:
      - "3000:3000"
    networks:
      - disaster-net

  backend:
    profiles:
      - docker
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: disaster-backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    networks:
      - disaster-net
    env_file:
      - .env.dev

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - disaster-net
    env_file:
      - .env.dev

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - disaster-net

  # ── LLM 사용량 기록(로컬 전용, 운영 아님) ─────────────────────────────────────────────
  # 모델 비교 실험의 호출을 LiteLLM 프록시로 모아 모델별 토큰·비용을 Grafana 로 본다. 설명은 infra/llm-usage/README.md.
  # 띄우기: docker compose --env-file .env.dev -f docker-compose.dev.yml --profile llm-usage up -d litellm prometheus grafana
  # (DATABASE_URL 을 .env.dev 의 POSTGRES_USER·POSTGRES_PASSWORD 로 만들므로 --env-file 이 필요하다)
  litellm:
    profiles:
      - llm-usage
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./infra/llm-usage/litellm-config.yaml:/app/config.yaml:ro
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # 로컬 전용 관리 키(127.0.0.1 에만 열림). 실험 실행에는 이 키로 발급한 가상 키를 쓴다(infra/llm-usage/README.md)
      LITELLM_MASTER_KEY: sk-local-llm-usage
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      STORE_MODEL_IN_DB: "False"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
    networks:
      - disaster-net

  prometheus:
    profiles:
      - llm-usage
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/llm-usage/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - litellm
    networks:
      - disaster-net

  grafana:
    profiles:
      - llm-usage
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./infra/llm-usage/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - postgres
      - prometheus
    networks:
      - disaster-net

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:


networks:
  disaster-net:
