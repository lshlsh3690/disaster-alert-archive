# 로컬 전용. 사용량 기록의 원본은 LiteLLM 이 쓰는 litellm DB 이고, Prometheus 는 보조다.
apiVersion: 1

datasources:
  - name: LiteLLM 사용량 DB
    uid: litellm-postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: litellm
      sslmode: disable
      postgresVersion: 1600
    isDefault: true

  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
