# 로컬 전용 LLM 사용량 기록용 LiteLLM 프록시 설정 (운영에는 쓰지 않는다).
# 앱(평가 도구)은 OpenAI·TEI 대신 http://localhost:4000 을 부르고, 프록시가 아래 주소로 넘기며 호출마다
# 모델·토큰·비용을 litellm DB 의 "LiteLLM_SpendLogs" 에 남긴다. Grafana 가 그 표를 읽어 화면을 그린다.
#
# model_name 은 실제 모델 ID 그대로 둔다 — EmbeddingCandidates 의 modelId 와 같아야 한다.
# 로컬 모델(TEI)은 요금이 없으므로 단가를 0 으로 두고, 토큰만 기록한다.
model_list:
  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY
  - model_name: text-embedding-3-large
    litellm_params:
      model: openai/text-embedding-3-large
      api_key: os.environ/OPENAI_API_KEY

  # 재클러스터링의 LLM 폴백(EventLLMDecisionService, 공용 채팅 모델). 012 실행별 가상 키가 이 모델을 함께 허용한다
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # TEI 컨테이너는 호스트 포트로 떠 있다(specs/012 contracts 1절). 프록시 컨테이너에서는 host.docker.internal 로 닿는다
  - model_name: Qwen/Qwen3-Embedding-0.6B
    litellm_params:
      model: openai/Qwen/Qwen3-Embedding-0.6B
      api_base: http://host.docker.internal:8081/v1
      api_key: unused
      # LiteLLM 은 text-embedding-3 이 아닌 모델에 dimensions 를 보내면 거부한다. TEI 는 원래 1024 차원이라 빼도 같다
      drop_params: true
      input_cost_per_token: 0
      output_cost_per_token: 0
  - model_name: intfloat/multilingual-e5-large-instruct
    litellm_params:
      model: openai/intfloat/multilingual-e5-large-instruct
      api_base: http://host.docker.internal:8082/v1
      api_key: unused
      # LiteLLM 은 text-embedding-3 이 아닌 모델에 dimensions 를 보내면 거부한다. TEI 는 원래 1024 차원이라 빼도 같다
      drop_params: true
      input_cost_per_token: 0
      output_cost_per_token: 0
  - model_name: dragonkue/BGE-m3-ko
    litellm_params:
      model: openai/dragonkue/BGE-m3-ko
      api_base: http://host.docker.internal:8083/v1
      api_key: unused
      # LiteLLM 은 text-embedding-3 이 아닌 모델에 dimensions 를 보내면 거부한다. TEI 는 원래 1024 차원이라 빼도 같다
      drop_params: true
      input_cost_per_token: 0
      output_cost_per_token: 0

litellm_settings:
  # /metrics 로 Prometheus 지표를 낸다. 라이선스 없이 나오는지는 띄워서 확인한다(Enterprise 기능일 수 있음)
  callbacks: ["prometheus"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # 토큰·비용만 필요하다 — 요청·응답 본문(재난문자 원문, 벡터)은 기록하지 않는다
  store_prompts_in_spend_logs: false
